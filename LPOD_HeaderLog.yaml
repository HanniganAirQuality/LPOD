  changelog: Firmware differential channel assignments corrected to match actual hardware wiring per Alphasense B4 datasheet.
    Auxiliary electrode moved from differential (0-1) to (2-3), Worker from (2-3) to (0-1).
    Renamed Alphasense_Main to Alphasense_Worker & Alphasense_Aux to Alphasense_Auxiliary to reflect proper electrode roles.
    ads_module.cpp updated with correct differential read channel assignments.
  SD_fileinfo:  
    FileName: OzPODID_YYYY_MM_dd
    FileType: .CSV
  SD:
    DateTime:
      unit: timestamp
      dtype: string
      format: "YYYY-MM-ddThh:mm:ss"
      sensor: DS3231
    MiCS2611_Ozone:
      unit: ADU
      dtype: uint16_t
      sensor: MiCS-2611
      adc: ADS1115
      adc_mode: single-ended
    MQ131_Ozone:
      unit: ADU
      dtype: uint16_t
      sensor: MQ131
      adc: ADS1115
      adc_mode: single-ended
    Alphasense_Worker:
      unit: ADU
      dtype: int16_t
      sensor: Alphasense B4
      adc: ADS1115
      adc_mode: differential (0-1)
      description: Worker electrode; firmware corrected to read proper differential pair (0-1) in V4, renamed from Alphasense_Main
    Alphasense_Auxiliary:
      unit: ADU
      dtype: int16_t
      sensor: Alphasense B4
      adc: ADS1115
      adc_mode: differential (2-3)
      description: Auxiliary electrode; firmware corrected to read proper differential pair (2-3) in V4, renamed from Alphasense_Aux
    Temperature:
      unit: Celsius
      dtype: float
      sensor: BME680
    Pressure:
      unit: Pascals
      dtype: float
      sensor: BME680
    Relative_Humidity:
